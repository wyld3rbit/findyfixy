# Runs the same checks the pre-commit hook runs: tracker data, tracker server
# tests and the privacy scan of the tree. `main` requires this to pass.
# Actions are pinned by commit SHA, because a tag can be moved after the fact.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install uv==0.13.1
      - run: make check
