# Two jobs. `attestation` is the CI gate for answer quality and runs first.
# `check` runs what the pre-commit hook runs (tracker data, tracker server
# tests, the privacy scan, the product tests) and starts only after it.
# `main` requires both to pass.
#
# Safe for a public repository: the trigger is `pull_request` (never
# `pull_request_target`), so a fork's code runs without secrets and with a
# read-only token, and checkout keeps no credential. Nothing here writes to
# the repository or posts a comment.
# Actions are pinned by commit SHA, because a tag can be moved after the fact.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The CI gate (code/src/wyld3rness/eval/attest.py). A live eval needs a GPU, so the
  # developer runs `make eval-gate` and commits the attestation it writes on a
  # pass. This job rehashes the answer-affecting files and fails when any
  # differs from the attested ones. Its own job and workspace, before any
  # test: nothing else has run on this checkout, so no test or install step
  # can alter what is hashed, and an unattested change fails in seconds.
  # Plain python3 with -I and the standard library only: it reads and hashes
  # files, imports none of them, and is called directly so that exactly one
  # file of the checkout runs. A process control, not a security control: it
  # trusts the local run.
  attestation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Verify the eval attestation
        run: python3 -I code/src/wyld3rness/eval/attest.py verify --root code --attestation examples/findyfixy/evals/attestation.json

  check:
    needs: attestation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install uv==0.13.1
      # make check runs uv offline first, so fill the cache once with what it needs.
      - run: uv run --no-project --with markdown --with pytest python -c "pass"
      - run: make check

      # The product tests, which until Day 5 ran only in the local hook. --locked
      # fails if uv.lock is out of date instead of re-resolving it here. Linux
      # wheels from the same lock include torch and its CUDA libraries (about
      # 3 GB to download), so this step costs a few minutes. There is no cache:
      # no actions/cache SHA has been vetted for this repository yet.
      - name: Product tests
        if: ${{ !cancelled() }}
        run: |
          uv sync --locked --all-packages --project code
          make test

      # The harness alone, in an environment with no app installed: proves the
      # harness imports nothing of FindyFixy's. Small (no torch), so it is fast.
      - name: Harness tests, no app installed
        if: ${{ !cancelled() }}
        run: make test-harness
