<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLM Production Sprint</title>
<style>
:root{
  --bg:#f5f5f3;--col:#ebebe7;--card:#fff;--fg:#1b1b1b;--muted:#62625e;--line:#dcdcd6;
  --accent:#2457a6;--accent-soft:#e6eefa;--ok:#1f7a45;--ok-soft:#e3f3e9;--warn:#a35a00;--warn-soft:#fbefdc;
  --bar:#dde3ea;--fill:#ff7a1a;--code:#efefeb;--shadow:0 1px 2px rgba(0,0,0,.06),0 1px 1px rgba(0,0,0,.04);
  --shadow-hi:0 4px 14px rgba(0,0,0,.10);--radius:10px;--panel-w:520px;--toph:56px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121212;--col:#1a1a1a;--card:#222;--fg:#ececec;--muted:#a3a3a3;--line:#333;
  --accent:#8db4ee;--accent-soft:#1f2b3d;--ok:#6fcf8f;--ok-soft:#1b2e22;--warn:#f0b35c;--warn-soft:#33281a;
  --bar:#2a3442;--code:#2a2a2a;--shadow:0 1px 2px rgba(0,0,0,.4);--shadow-hi:0 4px 14px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{
  --bg:#121212;--col:#1a1a1a;--card:#222;--fg:#ececec;--muted:#a3a3a3;--line:#333;
  --accent:#8db4ee;--accent-soft:#1f2b3d;--ok:#6fcf8f;--ok-soft:#1b2e22;--warn:#f0b35c;--warn-soft:#33281a;
  --bar:#2a3442;--code:#2a2a2a;--shadow:0 1px 2px rgba(0,0,0,.4);--shadow-hi:0 4px 14px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.01em;word-spacing:.05em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Top bar: title, countdown, the work-versus-time bar, view switch, panels. */
#top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
#top .in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.ttl{font-weight:700;white-space:nowrap}
#count{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted);font-size:14px}
.track{position:relative;flex:1 1 140px;min-width:100px;height:8px;background:var(--bar);border-radius:4px;overflow:hidden}
#bar{height:100%;width:0;background:var(--fill);transition:width .3s}
#timemark{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);left:0}
#pace{font-size:14px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 12px;cursor:pointer;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:600}
.btn{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:14px}
.btn:hover,.seg button:hover{background:var(--card)}
.right{margin-left:auto;display:flex;gap:8px;align-items:center}
@media (max-width:760px){.track{flex-basis:100%;order:5}.right{margin-left:0}}

/* Board: three columns. */
main{max-width:1280px;margin:0 auto;padding:20px 16px 48px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:760px){.board{grid-template-columns:1fr}}
.col{background:var(--col);border-radius:12px;padding:10px}
.col h2{display:flex;align-items:center;gap:8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:2px 4px 10px}
.col h2 .n{background:var(--card);border-radius:999px;padding:0 8px;font-size:12px;color:var(--fg)}
.col.doing h2::before,.col.deck h2::before,.col.done h2::before{content:"";width:8px;height:8px;border-radius:50%}
.col.deck h2::before{background:var(--muted)}
.col.doing h2::before{background:var(--fill)}
.col.done h2::before{background:var(--ok)}
.cards{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.empty{color:var(--muted);font-size:14px;padding:10px 6px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:var(--shadow-hi);transform:translateY(-1px)}
.card[aria-current="true"]{border-color:var(--accent)}
.card .tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.card .tag.task{background:var(--code);color:var(--muted)}
.card .t{display:block;font-weight:600;margin:6px 0 4px;line-height:1.35}
.card .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .meta .late{color:var(--warn)}
.col.done .card{opacity:.85}
.col.done .card .t{font-weight:500}

/* Console view: the live visualization, embedded. */
#console{display:none}
body.view-console #console{display:block}
body.view-console .board{display:none}
#console .bar{font-size:14px;color:var(--muted);margin:0 0 8px}
#console iframe{width:100%;height:calc(100vh - var(--toph) - 90px);min-height:520px;border:1px solid var(--line);border-radius:12px;background:var(--card)}

/* One side panel for a card, the log or the about text. It overlays, never pushes. */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s;z-index:8}
body.panel-open #scrim{opacity:1;pointer-events:auto}
#panel{position:fixed;top:0;right:0;bottom:0;width:var(--panel-w);max-width:100vw;background:var(--card);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .2s;z-index:9;display:flex;flex-direction:column;visibility:hidden}
body.panel-open #panel{transform:none;visibility:visible}
#panel .hd{display:flex;gap:10px;align-items:flex-start;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
#panel .hd h2{font-size:19px;margin:0;line-height:1.3;flex:1}
#panel .hd .sub{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-bottom:2px}
#panel .bd{overflow:auto;padding:14px 18px 32px;flex:1}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;text-transform:capitalize}
.pill.deck{background:var(--code);color:var(--muted)}
.pill.doing{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:12px 0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
.lead{margin:8px 0 14px}
.sec{border-top:1px solid var(--line);padding:10px 0}
.sec > summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
.sec > summary::-webkit-details-marker{display:none}
.sec > summary::after{content:"+";color:var(--muted)}
.sec[open] > summary::after{content:"\2212"}
.sec .count{color:var(--muted);font-weight:400}
ul.ck{list-style:none;margin:8px 0 0;padding:0}
ul.ck li{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:15px}
ul.ck input{margin-top:4px;width:17px;height:17px;accent-color:var(--ok)}
ul.dec,ol.log{list-style:none;margin:8px 0 0;padding:0}
ul.dec li,ol.log li{padding:8px 0;border-top:1px solid var(--line);font-size:15px}
ul.dec li:first-child,ol.log li:first-child{border-top:0}
.when{display:block;color:var(--muted);font-size:13px}
ul.dec .why{color:var(--muted)}

/* Rendered lesson and decision-record HTML. */
.lesson{font-size:15px}
.lesson h2{font-size:17px;margin:20px 0 6px}
.lesson h3{font-size:15px;margin:16px 0 4px}
.lesson ul,.lesson ol{padding-left:20px}
.lesson code{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--code);padding:1px 5px;border-radius:4px;letter-spacing:0;word-spacing:0}
.lesson pre{position:relative;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 70px 10px 12px;overflow:auto}
.lesson pre code{background:none;padding:0;white-space:pre-wrap;word-break:break-word}
.lesson img{max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
.lesson table{border-collapse:collapse;width:100%;font-size:14px}
.lesson th,.lesson td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
.copy{position:absolute;top:6px;right:6px;font-size:12px;color:var(--accent);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer}
.err{color:var(--muted);font-size:14px}
.foot{max-width:1280px;margin:0 auto;padding:0 16px 24px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="top"><div class="in">
  <span class="ttl" id="ttl">LLM Production Sprint</span>
  <span id="count">--</span>
  <div class="track" title="Orange: days done. Black line: time used."><div id="bar"></div><div id="timemark"></div></div>
  <span id="pace"></span>
  <div class="right">
    <div class="seg" role="group" aria-label="View">
      <button type="button" data-view="board" aria-pressed="true">Board</button>
      <button type="button" data-view="console" aria-pressed="false">Console</button>
    </div>
    <button class="btn" type="button" data-open="log">Log</button>
    <button class="btn" type="button" data-open="about">About</button>
  </div>
</div></header>

<main>
  <div class="board" id="board" aria-live="polite"></div>
  <section id="console" aria-label="Live visualization">
    <p class="bar"><span id="vizstatus"></span> <a id="vizlink" target="_blank" rel="noopener">Open in its own tab</a></p>
    <iframe id="vizframe" title="Live visualization" hidden></iframe>
  </section>
</main>
<div class="foot" id="foot"></div>

<div id="scrim" data-close></div>
<aside id="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle">
  <div class="hd"><h2 id="ptitle"></h2><button class="btn" type="button" data-close aria-label="Close panel">Close</button></div>
  <div class="bd" id="pbody"></div>
</aside>

<script>
/* This page is code only. The record is record/progress.json and the lessons are
   the .md files; tools/serve.py serves both (/api/progress, /api/lesson/N), and the
   decision records in code/docs/adr/ (/api/adrs, /api/adr/N).

   The board's columns come from each card's `status` in the record, set by hand
   as work moves. Self-checks do not move a card: from Day 5 they are ticked only
   in the final review. Ticks made here are a convenience kept in this browser;
   the record's `done` list is the record. */
var DATA = null, ADRS = [], CARDS = [];
var KEY = "llm-sprint-v1";
var state = (function(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } })();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmt(iso, long){
  var p = iso.split("-");
  var o = long ? {timeZone:"UTC",weekday:"short",month:"short",day:"numeric"} : {timeZone:"UTC",month:"short",day:"numeric"};
  return new Date(Date.UTC(+p[0], +p[1]-1, +p[2])).toLocaleDateString("en-US", o);
}
function today(){ var d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function pad(n){ return (n < 10 ? "0" : "") + n; }

/* Days and tasks become one card shape, so the board treats them alike. A day's
   planned date plays the part of a task's due date. */
function toCards(){
  var days = DATA.days.map(function(d){
    return {key:"day"+d.n, kind:"day", n:d.n, label:"Day "+d.n, title:d.title, status:d.status,
            due:d.date, started:d.started, finished:d.finished, text:d.outcome, day:d};
  });
  var tasks = (DATA.tasks || []).map(function(t){
    return {key:"task-"+t.id, kind:"task", label:"Task", title:t.title, status:t.status,
            due:t.due, started:t.started, finished:t.finished, text:t.note || ""};
  });
  return days.concat(tasks);
}
function isTicked(d, i){ return d.done.indexOf(i) > -1 || !!state["c"+d.n+"_"+i]; }
function ticks(d){ return d.checks.filter(function(_, i){ return isTicked(d, i); }).length; }

/* One date per card, the one that answers "when" for its column. */
function when(c){
  if(c.status === "done") return {text:"Done "+fmt(c.finished)};
  if(c.status === "doing") return {text:"Started "+fmt(c.started)};
  if(!c.due) return {text:"No date"};
  var late = c.due < today();
  return {text:(c.kind === "day" ? "Planned " : "Due ")+fmt(c.due), late:late};
}
/* Deck: soonest first, undated last. Doing: oldest start first. Done: newest first. */
function sorted(status){
  var list = CARDS.filter(function(c){ return c.status === status; });
  var k = {deck:function(c){ return c.due || "9999"; }, doing:function(c){ return c.started; }, done:function(c){ return c.finished; }}[status];
  list.sort(function(a, b){ return k(a) < k(b) ? -1 : k(a) > k(b) ? 1 : 0; });
  return status === "done" ? list.reverse() : list;
}
function cardHTML(c){
  var w = when(c);
  /* One line, one date. Self-check counts live in the panel: from Day 5 they are
     ticked only in the final review, so on a card they read as unfinished work. */
  var meta = '<span class="'+(w.late ? "late" : "")+'">'+esc(w.text)+'</span>';
  return '<li><button class="card" type="button" data-card="'+c.key+'">'
    + '<span class="tag '+c.kind+'">'+esc(c.label)+'</span>'
    + '<span class="t">'+esc(c.title)+'</span>'
    + '<span class="meta">'+meta+'</span></button></li>';
}
function renderBoard(){
  var cols = [["deck","Deck"],["doing","Doing"],["done","Done"]];
  document.getElementById("board").innerHTML = cols.map(function(col){
    var list = sorted(col[0]);
    return '<section class="col '+col[0]+'" aria-label="'+col[1]+'"><h2>'+col[1]+'<span class="n">'+list.length+'</span></h2>'
      + (list.length ? '<ul class="cards">'+list.map(cardHTML).join("")+'</ul>' : '<p class="empty">Nothing here.</p>')
      + '</section>';
  }).join("");
  markCurrent();
}

/* Countdown and pace. Work is days done out of all days, so the bar moves only
   when a day closes. */
function localDate(s){ var p = s.split(/[-T:]/).map(Number); return new Date(p[0], p[1]-1, p[2], p[3]||0, p[4]||0, p[5]||0); }
var START, END;
function tick(){
  if(!END) return;
  var now = new Date(), left = Math.max(0, END - now);
  var tfrac = Math.min(1, Math.max(0, (now - START) / (END - START)));
  var done = DATA.days.filter(function(d){ return d.status === "done"; }).length;
  var work = done / DATA.days.length;
  var s = Math.floor(left/1000), d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  var cnt = document.getElementById("count");
  cnt.textContent = left ? d+"d "+h+"h "+pad(m)+"m left" : "Time is up";
  cnt.title = "Ends " + END.toLocaleString("en-US", {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
  document.getElementById("bar").style.width = (100*work).toFixed(1) + "%";
  document.getElementById("timemark").style.left = "calc(" + (100*tfrac).toFixed(2) + "% - 1px)";
  var gap = Math.round(100*(work - tfrac));
  document.getElementById("pace").textContent = done+"/"+DATA.days.length+" days · "+(gap >= 0 ? "ahead "+gap : "behind "+(-gap))+" pts";
}
setInterval(tick, 30000);

/* Lazy-loaded HTML: a lesson or a decision record, fetched on first open. */
function loadHTML(url, el){
  if(el.dataset.loaded) return;
  el.dataset.loaded = "1";
  el.textContent = "Loading...";
  fetch(url).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(html){ el.innerHTML = html; addCopyButtons(el); })
    .catch(function(){ delete el.dataset.loaded; el.innerHTML = '<p class="err">Could not load. Is tools/serve.py running?</p>'; });
}
function addCopyButtons(root){
  root.querySelectorAll("pre").forEach(function(pre){
    if(pre.querySelector(".copy")) return;
    var b = document.createElement("button");
    b.className = "copy"; b.type = "button"; b.textContent = "Copy";
    b.addEventListener("click", function(){
      var code = pre.querySelector("code"), text = code ? code.innerText : pre.innerText;
      var ok = function(){ b.textContent = "Copied"; setTimeout(function(){ b.textContent = "Copy"; }, 1500); };
      var fallback = function(){
        var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); ok(); } catch(e){} document.body.removeChild(ta);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok, fallback); } else { fallback(); }
    });
    pre.appendChild(b);
  });
}

function prompts(n){
  var f = "d" + (n < 10 ? "0"+n : n) + ".md";
  var start = "start day "+n+". "+(n>1 ? "Warm-up first: ask me to explain day "+(n-1)+" from memory, then tell me in one line what I missed. " : "")+"Read "+f+" and CLAUDE.md. Give me the outcome in one sentence and a plan for the whole day: steps in order, files each step creates, packages with licenses, and how I verify each one. Wait for my approval. Then walk me through one step at a time, showing the plan for any step that writes code, and wait for me to say done. Build everything in code/. At the end, run the self-check with me, save my numbers to the lesson's Results section, then ask me the drill. Last, ask for my evidence line and save it under the lesson's Evidence heading.";
  var resume = "resume day "+n+". Check the lesson's Results section, code/CHANGELOG.md and git log to see where I stopped, tell me in one line, then continue one step at a time.";
  return '<div class="lesson"><p>In Terminal, from the training folder, run <code>claude</code>, then paste:</p>'
    + '<pre><code>'+esc(start)+'</code></pre><p>Picking up after a break:</p><pre><code>'+esc(resume)+'</code></pre></div>';
}
function sec(title, count, body, attrs){
  return '<details class="sec"'+(attrs || "")+'><summary><span>'+title+(count !== undefined ? ' <span class="count">'+count+'</span>' : '')+'</span></summary>'+body+'</details>';
}
function cardPanel(c){
  var facts = [["Status", '<span class="pill '+c.status+'">'+c.status+'</span>']];
  if(c.due) facts.push([c.kind === "day" ? "Planned" : "Due", esc(fmt(c.due, true))]);
  if(c.started) facts.push(["Started", esc(fmt(c.started, true))]);
  if(c.finished) facts.push(["Finished", esc(fmt(c.finished, true))]);
  var html = '<dl class="facts">'+facts.map(function(f){ return '<dt>'+f[0]+'</dt><dd>'+f[1]+'</dd>'; }).join("")+'</dl>';
  if(c.text) html += '<p class="lead">'+esc(c.text)+'</p>';
  if(c.kind !== "day") return html;
  var d = c.day;
  var decs = (DATA.decisions || []).filter(function(x){ return x.day === d.n; });
  if(decs.length) html += sec("Decisions", decs.length, '<ul class="dec">'+decs.map(function(x){
    return '<li><span class="when">'+esc(fmt(x.date, true))+'</span><b>'+esc(x.decision)+'</b>'
      + '<div class="why">Rejected: '+esc(x.rejected)+'</div><div class="why">Why: '+esc(x.why)+'</div></li>';
  }).join("")+'</ul>');
  html += sec("Self-check", ticks(d)+"/"+d.checks.length, '<ul class="ck">'+d.checks.map(function(t, i){
    var id = "c"+d.n+"_"+i, rec = d.done.indexOf(i) > -1;
    return '<li><input type="checkbox" id="'+id+'" data-k="'+id+'"'+(isTicked(d, i) ? ' checked' : '')+(rec ? ' disabled title="In the record"' : '')+'><label for="'+id+'">'+esc(t)+'</label></li>';
  }).join("")+'</ul>');
  html += sec("Lesson", undefined, '<div class="lesson" data-src="/api/lesson/'+d.n+'"></div>');
  ADRS.filter(function(a){ return a.day === d.n; }).forEach(function(a){
    html += sec("Decision record "+("000"+a.n).slice(-4), undefined, '<p class="when">'+esc(a.title)+'</p><div class="lesson" data-src="/api/adr/'+a.n+'"></div>');
  });
  html += sec("Start in Claude Code", undefined, prompts(d.n));
  return html;
}
function logPanel(){
  var log = DATA.log.slice().reverse();
  return '<ol class="log">'+log.map(function(e){ return '<li><span class="when">'+esc(fmt(e.date, true))+'</span>'+esc(e.entry)+'</li>'; }).join("")+'</ol>';
}

/* The panel follows the URL hash (#day6, #task-walkthrough, #log, #about), so a
   card can be linked and the back button closes it. */
var lastFocus = null;
function openPanel(key){
  var title, sub = "", body;
  if(key === "log"){ title = "Session log"; sub = DATA.log.length+" entries"; body = logPanel(); }
  else if(key === "about"){ title = "About this course"; body = '<div class="lesson" data-src="/api/lesson/0"></div>'; }
  else {
    var c = CARDS.filter(function(x){ return x.key === key; })[0];
    if(!c) return closePanel(true);
    title = esc(c.title); sub = esc(c.label); body = cardPanel(c);
  }
  document.getElementById("ptitle").innerHTML = (sub ? '<span class="sub">'+sub+'</span>' : '')+title;
  var pb = document.getElementById("pbody");
  pb.innerHTML = body; pb.scrollTop = 0;
  pb.querySelectorAll("[data-src]").forEach(function(el){
    var det = el.closest("details");
    if(!det) return loadHTML(el.dataset.src, el);
    det.addEventListener("toggle", function(){ if(det.open) loadHTML(el.dataset.src, el); });
  });
  addCopyButtons(pb);
  if(!document.body.classList.contains("panel-open")) lastFocus = document.activeElement;
  document.body.classList.add("panel-open");
  markCurrent();
  document.querySelector("#panel [data-close]").focus();
}
function closePanel(fromHash){
  document.body.classList.remove("panel-open");
  // replaceState, not pushState: a pushed entry would let Back return to the
  // card's hash and reopen the panel that was just closed.
  if(!fromHash && location.hash) history.replaceState(null, "", location.pathname + location.search);
  markCurrent();
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
function route(){
  var key = location.hash.slice(1);
  if(key) openPanel(key); else closePanel(true);
}
function markCurrent(){
  var key = document.body.classList.contains("panel-open") ? location.hash.slice(1) : "";
  document.querySelectorAll(".card").forEach(function(b){ b.setAttribute("aria-current", b.dataset.card === key ? "true" : "false"); });
}

/* Console: the live visualization runs on its own server (port 8765). It is probed
   first, since an iframe to a stopped server shows a browser error page we cannot catch. */
var VIZ = location.protocol + "//" + location.hostname + ":8765/";
function setView(v){
  state.view = v; save();
  document.body.classList.toggle("view-console", v === "console");
  document.querySelectorAll("[data-view]").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.view === v ? "true" : "false"); });
  if(v === "console") probeViz();
}
function probeViz(){
  var frame = document.getElementById("vizframe"), status = document.getElementById("vizstatus");
  document.getElementById("vizlink").href = VIZ;
  status.textContent = "Checking...";
  fetch(VIZ, {mode:"no-cors", cache:"no-store"}).then(function(){
    status.textContent = "Running.";
    if(!frame.getAttribute("src")) frame.setAttribute("src", VIZ);
    frame.hidden = false;
  }).catch(function(){
    frame.hidden = true; frame.removeAttribute("src");
    status.textContent = "Not running. From the training folder: make ui";
  });
}

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-card],[data-open],[data-close],[data-view]");
  if(!t) return;
  if(t.dataset.view) return setView(t.dataset.view);
  if(t.hasAttribute("data-close")) return closePanel(false);
  var key = t.dataset.card || t.dataset.open;
  if(location.hash.slice(1) === key) return openPanel(key);
  location.hash = key;
});
document.addEventListener("change", function(e){
  var k = e.target.dataset && e.target.dataset.k;
  if(!k) return;
  if(e.target.checked) state[k] = true; else delete state[k];
  save();
  renderBoard();
  var c = CARDS.filter(function(x){ return x.key === location.hash.slice(1); })[0];
  var cnt = e.target.closest("details").querySelector(".count");
  if(c && cnt) cnt.textContent = ticks(c.day)+"/"+c.day.checks.length;
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && document.body.classList.contains("panel-open")) closePanel(false);
});
window.addEventListener("hashchange", route);

function boot(){
  fetch("/api/progress", {cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(data){
      DATA = data;
      /* The decision records are optional: without them the board still renders. */
      return fetch("/api/adrs", {cache:"no-store"}).then(function(r){ return r.ok ? r.json() : []; })
        .catch(function(){ return []; }).then(function(list){ ADRS = list; });
    })
    .then(function(){
      CARDS = toCards();
      START = localDate(DATA.countdownStart); END = localDate(DATA.countdownEnd);
      document.getElementById("ttl").title = "Planned "+fmt(DATA.plannedStart, true)+" to "+fmt(DATA.plannedEnd, true);
      document.getElementById("foot").textContent = "Record updated "+fmt(DATA.updated, true)+". Columns come from record/progress.json; ticks you make here stay in this browser.";
      renderBoard();
      tick();
      setView(state.view === "console" ? "console" : "board");
      route();
    })
    .catch(function(){
      document.getElementById("board").innerHTML = '<p class="err">The record could not be loaded. This page needs its server. From the training folder run <code>make ui</code>, then open http://127.0.0.1:8766</p>';
    });
}
boot();
</script>
</body>
</html>
