<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLM Production Sprint</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--fg:#1c1c1c;--muted:#5c5c5c;--line:#e2e2de;--accent:#1F3A5F;--ok:#1e6b3a;--bar:#dfe6ee;--code:#f0f0ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--panel:#1d1d1d;--fg:#ececec;--muted:#a8a8a8;--line:#333;--accent:#8fb3e0;--ok:#6fcf8f;--bar:#2a3442;--code:#262626}}
:root[data-theme="dark"]{--bg:#141414;--panel:#1d1d1d;--fg:#ececec;--muted:#a8a8a8;--line:#333;--accent:#8fb3e0;--ok:#6fcf8f;--bar:#2a3442;--code:#262626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.65 Verdana,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;letter-spacing:.01em;word-spacing:.08em}
:root{--drawer:400px;--toph:44px}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 48px;transition:margin .2s}
#days > h2.wk:first-child{margin-top:0}
#about{position:fixed;top:var(--toph);left:0;bottom:0;width:var(--drawer);max-width:90vw;overflow:auto;z-index:9;margin:0;border-radius:0;border-width:0 1px 0 0;transform:translateX(-100%);transition:transform .2s;padding:16px}
body.drawer-open #about{transform:none}
@media (min-width:1100px){body.drawer-open .wrap{margin-left:calc(var(--drawer) + 24px)}}
#drawerBtn{font:inherit;font-size:18px;line-height:1;background:none;border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:pointer;color:var(--fg)}
body.drawer-open #drawerBtn{background:var(--panel)}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:15px;margin-bottom:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-size:24px;font-variant-numeric:tabular-nums;margin-top:2px}
#top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:2px solid #FF7A1A;padding:6px 16px}
#top .in{max-width:1368px;margin:0 auto}
#top .row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-variant-numeric:tabular-nums}
.ttl{font-size:15px;font-weight:700;color:var(--fg);white-space:nowrap}
#count{font-size:15px;font-weight:700;color:var(--fg);white-space:nowrap}
.nums{font-size:13px;color:var(--muted);white-space:nowrap}
.track{position:relative;flex:1 1 160px;height:10px;background:var(--bar);border-radius:5px;overflow:hidden}
#bar{height:100%;width:0;background:#FF7A1A;border-radius:5px;transition:width .3s}
#timemark{position:absolute;top:0;bottom:0;width:3px;background:var(--fg);left:0}
h2.wk{font-size:18px;margin:28px 0 10px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.day.done{border-color:var(--ok)}
.head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline}
.num{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.title{font-weight:600}
.date{color:var(--muted);font-size:15px}
.head[data-t]{cursor:pointer}
.day.collapsed{padding:8px 14px;margin-bottom:6px}
.chip{margin-left:auto;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.day.done .chip{color:var(--ok)}
.chip + .toggle{margin-left:0}
.toggle{margin-left:auto;font:inherit;font-size:15px;color:var(--accent);background:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer}
.out{color:var(--muted);font-size:15px;margin:6px 0 10px}
.lesson{border-top:1px solid var(--line);margin-top:12px;padding-top:4px}
.lesson h2{font-size:18px;margin:22px 0 8px}
.lesson h3{font-size:16px;margin:18px 0 6px}
.lesson p,.lesson li{font-size:16px}
.lesson ul,.lesson ol{padding-left:22px;margin:6px 0}
.lesson li{padding:2px 0}
.lesson code{font:14px/1.5 Menlo,Consolas,monospace;background:var(--code);padding:1px 5px;border-radius:4px;letter-spacing:0;word-spacing:0}
.lesson pre{position:relative;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto;margin:10px 0}
.lesson pre code{background:none;padding:0}
.start pre code{white-space:pre-wrap;word-break:break-word}
.start pre{padding-right:70px}
.copy{position:absolute;top:6px;right:6px;font:13px Verdana,sans-serif;color:var(--accent);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer}
.lesson table{border-collapse:collapse;width:100%;font-size:15px;margin:10px 0}
.lesson th,.lesson td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.checks h3{font-size:16px;margin:16px 0 4px}
ul.ck{list-style:none;margin:0;padding:0}
ul.ck li{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:16px}
ul.ck li input{margin-top:6px;width:18px;height:18px}
.foot{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:15px;color:var(--muted)}
.foot input{width:64px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.note{font-size:14px;color:var(--muted);margin-top:28px}
#logBtn{font:inherit;font-size:14px;line-height:1;background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--fg);margin-left:auto}
body.log-open #logBtn{background:var(--panel)}
#logPanel{position:fixed;top:var(--toph);right:0;bottom:0;width:380px;max-width:90vw;overflow:auto;z-index:9;background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);transform:translateX(100%);visibility:hidden;transition:transform .2s,visibility .2s;padding:16px;font-size:15px}
body.log-open #logPanel{transform:none;visibility:visible}
#logPanel .hd{display:flex;justify-content:space-between;align-items:center;font-weight:bold;margin-bottom:8px}
#logPanel ol{list-style:none;margin:0;padding:0}
#logPanel li{padding:8px 0;border-top:1px solid var(--line)}
#logPanel .when{display:block;color:var(--muted);font-size:13px}
.viz{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.viz summary{cursor:pointer;color:var(--accent);font-weight:600}
.viz .vizbar{font-size:14px;color:var(--muted);margin:6px 0}
.viz iframe{width:100%;height:760px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.lessonbox{margin:10px 0}
.lessonbox summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:15px}
.plan{font-size:15px;margin:0 0 10px}
.plan .st{font-weight:600;color:var(--accent)}
.plan .st-approved,.plan .st-built,.plan .st-gated{color:var(--ok)}
.dec{margin:0 0 12px;font-size:15px}
.dec summary{cursor:pointer;color:var(--accent);font-weight:600}
.dec ul{list-style:none;margin:6px 0 0;padding:0}
.dec li{padding:8px 0;border-top:1px solid var(--line)}
.dec .when{display:block;color:var(--muted);font-size:13px}
.dec div{color:var(--muted)}
</style>
</head>
<body>
<div id="top"><div class="in row">
  <button id="drawerBtn" type="button" data-drawer aria-label="About this course" aria-controls="about" title="About this course">&#9776;</button>
  <span class="ttl" id="sub">LLM Production Sprint</span>
  <span id="count">--</span>
  <div class="track" title="Orange: checks done. Black line: time used."><div id="bar"></div><div id="timemark"></div></div>
  <span class="nums"><span id="workpct">Work 0%</span> · <span id="timepct">Time 0%</span> · <span id="pace"></span></span>
  <button id="logBtn" type="button" data-log aria-controls="logPanel" aria-expanded="false" title="Session log">Log</button>
</div></div>
<aside class="day" id="about"></aside>
<aside id="logPanel" aria-label="Session log"><div class="hd"><span id="logsum">Log</span><button class="toggle" type="button" data-log aria-label="Close log">Close</button></div><ol id="loglist"></ol></aside>
<div class="wrap">
<div class="tiles" id="tiles"></div>
<main id="days"></main>
<div class="note" id="note"></div>
</div>
<script>
/* This page is code only. The record is record/progress.json and the lessons are
   the .md files; tools/serve.py serves both (/api/progress, /api/lesson/N). */
var DATA = null;
var KEY = "llm-sprint-v1";
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
var state = load();
if (!state.open) state.open = {};

function isDone(d, i){ return d.done.indexOf(i) > -1 || !!state["c"+d.n+"_"+i]; }
function dayDone(d){ return d.checks.every(function(_,i){ return isDone(d,i); }); }
function fmt(iso){ var p = iso.split("-"); return new Date(Date.UTC(+p[0], +p[1]-1, +p[2])).toLocaleDateString("en-US",{timeZone:"UTC",weekday:"short",month:"short",day:"numeric"}); }
function nextDay(){ for (var i=0;i<DATA.days.length;i++){ if(!dayDone(DATA.days[i])) return DATA.days[i]; } return null; }

/* Lesson HTML is rendered by the server from the .md file and fetched on first open. */
function loadLesson(n, el){
  if(el.dataset.loaded) return;
  el.dataset.loaded = "1";
  el.textContent = "Loading...";
  fetch("/api/lesson/"+n).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(html){ el.innerHTML = html; addCopyButtons(el); })
    .catch(function(){ delete el.dataset.loaded; el.textContent = "Lesson text could not be loaded. Is tools/serve.py running?"; });
}

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function startBlock(n){
  var f = "d" + (n < 10 ? "0"+n : n) + ".md";
  var start = "start day "+n+". "+(n>1 ? "Warm-up first: ask me to explain day "+(n-1)+" from memory, then tell me in one line what I missed. " : "")+"Read "+f+" and CLAUDE.md. Give me the outcome in one sentence and a plan for the whole day: steps in order, files each step creates, packages with licenses, and how I verify each one. Wait for my approval. Then walk me through one step at a time, showing the plan for any step that writes code, and wait for me to say done. Build everything in code/. At the end, run the self-check with me, save my numbers to notes/day"+n+".md, then ask me the drill. Last, ask for my evidence line and save it to notes/evidence.md.";
  var resume = "resume day "+n+". Check notes/ and git log to see where I stopped, tell me in one line, then continue one step at a time.";
  return '<div class="lesson start"><h3>Start in Claude Code</h3>'
    + '<p>1. In Terminal, go to this training folder (the one that holds CLAUDE.md). Then run:</p><pre><code>'+esc('claude')+'</code></pre>'
    + '<p>2. Paste into Claude Code:</p><pre><code>'+esc(start)+'</code></pre>'
    + '<p>Picking up after a break:</p><pre><code>'+esc(resume)+'</code></pre></div>';
}

function stats(){
  var total=0, ticked=0, done=0;
  DATA.days.forEach(function(d){
    d.checks.forEach(function(_,i){ total++; if(isDone(d,i)) ticked++; });
    if(dayDone(d)) done++;
    var card = document.getElementById("day"+d.n);
    if(card) card.classList.toggle("done", dayDone(d));
    var chip = document.getElementById("chip-"+d.n);
    if(chip){ var c = d.checks.filter(function(_,i){ return isDone(d,i); }).length; chip.textContent = dayDone(d) ? "Done" : c+" / "+d.checks.length; }
  });
  var nx = nextDay();
  document.getElementById("sub").title = "Planned " + fmt(DATA.plannedStart) + " to " + fmt(DATA.plannedEnd) + ". Record updated " + fmt(DATA.updated) + ".";
  var tiles = [["Days complete", done+" / "+DATA.days.length],["Checks", ticked+" / "+total],["Next", nx ? "Day "+nx.n : "Done"]];
  document.getElementById("tiles").innerHTML = tiles.map(function(t){ return '<div class="tile"><div class="k">'+t[0]+'</div><div class="v">'+t[1]+'</div></div>'; }).join("");
  WORK = total ? ticked/total : 0;
  document.getElementById("bar").style.width = Math.round(100*WORK) + "%";
  tick();
}

/* Countdown: from the first session to the end of the last day, local time. */
function localDate(s){ var p = s.split(/[-T:]/).map(Number); return new Date(p[0], p[1]-1, p[2], p[3]||0, p[4]||0, p[5]||0); }
var START, END;
var WORK = 0;
function pad(n){ return (n < 10 ? "0" : "") + n; }
function tick(){
  if(!END) return;
  var now = new Date(), left = Math.max(0, END - now);
  var tfrac = Math.min(1, Math.max(0, (now - START) / (END - START)));
  var s = Math.floor(left/1000), d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), sec = s%60;
  var cnt = document.getElementById("count");
  cnt.textContent = left ? d+"d "+pad(h)+":"+pad(m)+":"+pad(sec)+" left" : "Time is up";
  cnt.title = "Ends " + END.toLocaleString("en-US", {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
  document.getElementById("timemark").style.left = "calc(" + (100*tfrac).toFixed(2) + "% - 1px)";
  document.getElementById("workpct").textContent = "Work " + Math.round(100*WORK) + "%";
  document.getElementById("timepct").textContent = "Time " + Math.round(100*tfrac) + "%";
  var gap = Math.round(100*(WORK - tfrac));
  document.getElementById("pace").textContent = gap >= 0 ? "Ahead by " + gap + " pts" : "Behind by " + (-gap) + " pts";
}
setInterval(tick, 1000);

function addCopyButtons(root){
  root.querySelectorAll("pre").forEach(function(pre){
    if(pre.querySelector(".copy")) return;
    var b = document.createElement("button");
    b.className = "copy"; b.type = "button"; b.textContent = "Copy";
    b.addEventListener("click", function(){
      var text = pre.querySelector("code") ? pre.querySelector("code").innerText : pre.innerText;
      var ok = function(){ b.textContent = "Copied"; setTimeout(function(){ b.textContent = "Copy"; }, 1500); };
      var fallback = function(){
        var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); ok(); } catch(e){} document.body.removeChild(ta);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok, fallback); } else { fallback(); }
    });
    pre.appendChild(b);
  });
}

function setOpen(key, open){
  state.open[key] = open; save();
  var body = document.getElementById("body-"+key), btn = document.getElementById("btn-"+key);
  body.hidden = !open;
  btn.textContent = open ? "Hide" : "Show";
  btn.setAttribute("aria-expanded", open ? "true" : "false");
  var card = body.closest(".day");
  if(card) card.classList.toggle("collapsed", !open);
}

/* The live visualization is a separate server (code/app/console.py, port 8765). It is embedded
   here so this page is the one landing page. It is probed first: an iframe to a stopped server
   shows a browser error page, not something we can catch. */
var VIZ_PORT = 8765;
function vizURL(){ return location.protocol + "//" + location.hostname + ":" + VIZ_PORT + "/"; }
function vizHTML(){
  return '<details class="viz" id="viz"'+(state.open.viz !== false ? ' open' : '')+'><summary>Live visualization</summary>'
    + '<p class="vizbar"><span id="vizstatus"></span> <a href="'+vizURL()+'" target="_blank" rel="noopener">Open in its own tab</a></p>'
    + '<iframe id="vizframe" title="Live visualization" hidden></iframe></details>';
}
function loadViz(){
  var frame = document.getElementById("vizframe"), status = document.getElementById("vizstatus");
  if(!frame) return;
  status.textContent = "Checking...";
  fetch(vizURL(), {mode: "no-cors", cache: "no-store"}).then(function(){
    status.textContent = "Running.";
    if(!frame.getAttribute("src")) frame.setAttribute("src", vizURL());
    frame.hidden = false;
  }).catch(function(){
    frame.hidden = true; frame.removeAttribute("src");
    status.textContent = "Not running. In the training folder run: make ui";
  });
}

/* Plan status and decisions for one day, from record/progress.json. Text is escaped: the record is data, not markup. */
function recordHTML(d){
  var out = "";
  if(d.plan) out += '<div class="plan"><span class="st st-'+esc(d.plan.status)+'">Plan: '+esc(d.plan.status)+'</span> <code>'+esc(d.plan.file)+'</code></div>';
  var decs = (DATA.decisions || []).filter(function(x){ return x.day === d.n; });
  if(decs.length){
    out += '<details class="dec"><summary>Decisions ('+decs.length+')</summary><ul>';
    decs.forEach(function(x){
      out += '<li><span class="when">'+esc(fmt(x.date))+'</span><b>'+esc(x.decision)+'</b>'
        + '<div><i>Rejected:</i> '+esc(x.rejected)+'</div><div><i>Why:</i> '+esc(x.why)+'</div></li>';
    });
    out += '</ul></details>';
  }
  return out;
}

function render(){
  var about = document.getElementById("about");
  about.innerHTML = '<div class="head"><span class="title">About this course</span><button class="toggle" type="button" data-drawer aria-label="Close">Close</button></div><div class="lesson" data-lesson="0"></div>';
  loadLesson(0, about.querySelector("[data-lesson]"));

  var nx = nextDay();
  if(nx && state.open["d"+nx.n] === undefined) state.open["d"+nx.n] = true;

  var html = vizHTML(), wk = 0;
  DATA.days.forEach(function(d){
    if(d.week !== wk){ wk = d.week; html += '<h2 class="wk">Week '+wk+(wk===1?": Build":": Ship")+'</h2>'; }
    var key = "d"+d.n;
    html += '<div class="day" id="day'+d.n+'"><div class="head" data-t="'+key+'"><span class="num">Day '+d.n+'</span><span class="title">'+d.title+'</span><span class="date">'+fmt(d.date)+'</span><span class="chip" id="chip-'+d.n+'"></span><button class="toggle" type="button" id="btn-'+key+'"></button></div>';
    html += '<div id="body-'+key+'">';
    html += '<div class="out">'+d.outcome+'</div>';
    html += recordHTML(d);
    html += startBlock(d.n);
    html += '<details class="lessonbox"><summary>Lesson text ('+esc(d.file)+')</summary><div class="lesson" data-lesson="'+d.n+'"></div></details>';
    html += '<div class="checks"><h3>Self-check</h3><ul class="ck">';
    d.checks.forEach(function(c,i){
      var id = "c"+d.n+"_"+i;
      html += '<li><input type="checkbox" id="'+id+'" data-k="'+id+'"'+(isDone(d,i)?' checked':'')+(d.done.indexOf(i)>-1?' disabled':'')+'><label for="'+id+'">'+c+'</label></li>';
    });
    html += '</ul></div></div></div>';
  });
  document.getElementById("days").innerHTML = html;
  if(state.open.viz !== false) loadViz();

  setDrawer(state.drawer === undefined ? window.innerWidth >= 1100 : state.drawer, false);
  DATA.days.forEach(function(d){ setOpen("d"+d.n, !!state.open["d"+d.n]); });
  addCopyButtons(document);
  var last = DATA.log[DATA.log.length-1];
  document.getElementById("logsum").textContent = "Session log (" + DATA.log.length + ")";
  var ll = document.getElementById("loglist");
  ll.textContent = "";
  DATA.log.slice().reverse().forEach(function(e){
    var li = document.createElement("li"), w = document.createElement("span");
    w.className = "when"; w.textContent = e.date ? fmt(e.date) : "";
    li.appendChild(w); li.appendChild(document.createTextNode(e.entry)); ll.appendChild(li);
  });
  document.getElementById("note").textContent = "Record: record/progress.json, kept by Claude Code. Browser ticks are local. Last log: " + fmt(last.date) + ", " + last.entry;
  stats();
}

/* Left drawer, like a chat app sidebar. Pushes content on wide screens, overlays on narrow ones. */
function setDrawer(open, persist){
  document.body.classList.toggle("drawer-open", open);
  document.getElementById("drawerBtn").setAttribute("aria-expanded", open ? "true" : "false");
  if(persist !== false){ state.drawer = open; save(); }
}
function fitTop(){ document.documentElement.style.setProperty("--toph", document.getElementById("top").offsetHeight + "px"); }
window.addEventListener("resize", fitTop);
/* Right slide-in log. Overlays, never pushes content. Not persisted: it starts closed. */
function setLog(open){
  document.body.classList.toggle("log-open", open);
  document.getElementById("logBtn").setAttribute("aria-expanded", open ? "true" : "false");
}
document.addEventListener("keydown", function(e){
  if(e.key !== "Escape") return;
  if(document.body.classList.contains("log-open")) setLog(false);
  else if(document.body.classList.contains("drawer-open")) setDrawer(false);
});

document.addEventListener("click", function(e){
  if(e.target.closest("[data-log]")){ setLog(!document.body.classList.contains("log-open")); return; }
  if(e.target.closest("[data-drawer]")){ setDrawer(!document.body.classList.contains("drawer-open")); return; }
  var t = e.target.closest("[data-t]");
  if(t){ var k = t.dataset.t; setOpen(k, !state.open[k]); }
});
document.addEventListener("change", function(e){
  var t = e.target;
  if(t.dataset.k){ state[t.dataset.k] = t.checked; save(); stats(); }
});
/* A <details> toggle event does not bubble, so listen in the capture phase. */
document.addEventListener("toggle", function(e){
  var box = e.target;
  if(box.id === "viz"){
    state.open.viz = box.open; save();
    if(box.open) loadViz();
    return;
  }
  if(box.classList && box.classList.contains("lessonbox") && box.open){
    var el = box.querySelector("[data-lesson]");
    loadLesson(+el.dataset.lesson, el);
  }
}, true);

function boot(){
  fetch("/api/progress", {cache: "no-store"}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(data){
      DATA = data;
      START = localDate(DATA.countdownStart);
      END = localDate(DATA.countdownEnd);
      fitTop();
      render();
    })
    .catch(function(){
      document.getElementById("days").innerHTML = '<div class="day"><p>The record could not be loaded. This page needs its server. From the training folder run:</p>'
        + '<pre><code>uv run --no-project --with markdown python tools/serve.py</code></pre><p>Then open http://127.0.0.1:8766</p></div>';
    });
}
