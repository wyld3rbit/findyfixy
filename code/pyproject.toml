[project]
name = "wyld3rness"
version = "0.1.0"
description = "A harness for LLM applications: an eval gate attested in CI, and every run traced with OpenTelemetry"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
# Only what the harness itself imports. The example app's own libraries are
# declared in examples/findyfixy/pyproject.toml, so installing the harness
# alone never pulls in torch, Postgres drivers or LangGraph.
dependencies = [
    "langchain-ollama>=1.1.0",
    "ollama>=0.6.3",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.14.1",
]

# The CI gate's check, for a local run. CI itself calls the file with plain
# `python3 -I` and no install, so that nothing it hashes is imported.
[project.scripts]
wyld3rness-attest = "wyld3rness.eval.attest:main"

[build-system]
# uv's own build backend: the same supplier as the installer, no extra one.
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

# One lock and one .venv for the harness and the example apps that test it.
# `uv sync --all-packages` installs every member; `uv sync --package wyld3rness`
# installs the harness alone, which is how `make test-harness` proves it stands
# without any app.
[tool.uv.workspace]
members = ["examples/findyfixy"]

[tool.uv]
# Release cooldown: ignore anything published after this date, because fresh
# releases are where hijacks land. Move it forward deliberately, about 7 days
# before the day it moves, never to today. Moved 2026-11-09 (Day 6, OpenTelemetry).
exclude-newer = "2026-11-02T00:00:00Z"
# `mcp` lists these as hard requirements, but only its HTTP serving and OAuth
# features import them. This project talks to MCP over stdio, so they are not
# needed. A never-true marker removes them from the install (about 4.4 MB, most
# of it `cryptography`) while the lock still records them. If an MCP feature
# ever raises ImportError for one of these, delete its line here.
# An override also cancels a package you add yourself: `uv add pyjwt` succeeds,
# then `import jwt` fails. Day 7 needs pyjwt and Day 9 needs a server such as
# uvicorn, so delete those lines FIRST. tests/test_dependencies.py fails if not.
override-dependencies = [
  "uvicorn ; sys_platform == 'never'",
  "python-multipart ; sys_platform == 'never'",
  "pyjwt ; sys_platform == 'never'",
  "click ; sys_platform == 'never'",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-sugar>=1.1.1",
]

[tool.pytest.ini_options]
# Both packages are installed (editable) by `uv sync --all-packages`, so no
# path tweak is needed: tests import `wyld3rness` and `findyfixy` as a user would.
# tests/ is the harness's suite, examples/findyfixy/tests/ the example's.
testpaths = ["tests", "examples/findyfixy/tests"]
# Tests that call real models are deselected by default. They need a running
# Ollama and are slow and non-deterministic. Run them with:
#   uv run pytest -m integration
# The quality gate (tests/test_quality.py) is deselected for the same reason: it
# runs the whole golden set through live models and takes a long time. Run it with:
#   uv run pytest -m quality
# A -m on the command line overrides this one (the last -m wins).
# Test file names are unique across both suites: pytest's default import mode
# imports each by its bare name.
addopts = "-m 'not integration and not quality'"
markers = [
    "integration: needs a live service, Ollama or Postgres (run with `pytest -m integration`)",
    "quality: the answer-quality release gate, live models, minutes long (run with `pytest -m quality`)",
]
