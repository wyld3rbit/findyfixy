[project]
name = "triage-copilot"
version = "0.1.0"
description = "Incident triage agent: small-model-first routing with LangGraph and Ollama"
requires-python = ">=3.13,<3.14"
dependencies = [
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.16",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-sugar>=1.1.1",
]

[tool.pytest.ini_options]
# The project is not an installable package, so put the repo root on the
# import path. Without this, `import app` fails inside tests.
pythonpath = ["."]
testpaths = ["tests"]
# Tests that call real models are deselected by default. They need a running
# Ollama and are slow and non-deterministic. Run them with:
#   uv run pytest -m integration
# A -m on the command line overrides this one (the last -m wins).
addopts = "-m 'not integration'"
markers = [
    "integration: calls real Ollama models (run with `pytest -m integration`)",
]
