[project]
name = "findyfixy"
version = "0.1.0"
description = "An incident-triage agent: the example app the wyld3rness harness is tested on"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "wyld3rness",
    "langchain-core>=1.6.12",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.16",
    "mcp>=1.30.0,<2",
    "opentelemetry-api>=1.45.2",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
]

[tool.uv.sources]
wyld3rness = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
