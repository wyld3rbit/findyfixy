        <text class="t" x="357" y="-70">Tracing</text>
        <text class="s" x="357" y="-52">Day 6, Langfuse</text>
      </g>
<g class="node" data-status="planned">
        <rect x="460" y="-96" width="130" height="64" rx="8"/>
        <text class="t" x="525" y="-70">Policy</text>
