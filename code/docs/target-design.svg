<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" width="800" height="570" role="img" aria-label="The two planes. The data plane is the agent: recall, model reasoning and a proposed action. The control plane is the harness, a checkpoint on every path in and out of it. An identity broker issues a scoped token per call. Every model call goes through a gateway. A proposed action passes policy, then approval, before it reaches tools and systems. Every step is traced, traces feed evaluation, and evaluation sets the autonomy level of each action class, which approval applies. Tracing and evaluation are built; the other checkpoints are planned.">
